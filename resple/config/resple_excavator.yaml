/**:
  ros__parameters:
    topic_imu: /hal/box_imu
    acc_ratio: false  # /hal/box_imu reports m/s^2.
    lidars: [livox]
    livox:
      topic_lidar: /mole/livox_lidar_publisher/lidar_front_left_filtered
      lidar_type: Mid360Boxi
      scan_line: 4
      blind: 0.5
      # q_lb/t_lb: imu_box_link -> livox_front_left from m445.urdf.xacro.
      q_lb: [0.00553152, -0.92178345, -0.38757200, -0.00852203]
      t_lb: [-0.119, 0.03, -0.003]
      w_pt: 0.01
    lidar_time_offset: 0.0
    publish_accumulated_map: true
    global_map_topic: /m4/lidar/point_cloud_map
    global_map_frame: map
    machine_imu_frame: imu_box_link
    global_map_voxel_resolution: 0.2
    global_map_publish_period: 1.0
    global_map_clear_service: /m4/lidar/clear_points
    knot_hz: 100
    if_lidar_only: false
    ds_scan_voxel: 0.2
    point_filter_num: 1
    nn_thresh: 0.5
    coeff_cov: 5.0
    num_nn: 8
    ds_lm_voxel: 0.2
    cube_len: 1000.0
    cov_P0: 0.02
    cov_RCP_pos_old: 0.5
    cov_RCP_ort_old: 0.5
    cov_RCP_pos_new: 1.0
    cov_RCP_ort_new: 1.0
    std_sys_pos: 0.1
    std_sys_ort: 0.1
    cov_acc: [1.0, 1.0, 1.0]
    cov_gyro: [0.1, 0.1, 0.1]
    cov_ba: [0.2, 0.2, 0.2]
    cov_bg: [0.2, 0.2, 0.2]
    n_iter: 3
    num_points_upd: 100
